<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#090a10" />
  <title>Keys Vault</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 10% 15%, rgba(10, 132, 255, 0.28), transparent 45%),
                     radial-gradient(circle at 90% 85%, rgba(236, 72, 153, 0.22), transparent 45%),
                     radial-gradient(circle at 50% 50%, rgba(94, 92, 230, 0.18), transparent 50%),
                     #090a10;
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-folder: rgba(255, 255, 255, 0.05);
      --glass-pill: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-specular: rgba(255, 255, 255, 0.35);
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.55);
      --ios-blue: #0A84FF;
      --ios-green: #30D158;
      --ios-red: #FF453A;
      --radius-large: 26px;
      --radius-medium: 16px;
      --radius-small: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: env(safe-area-inset-top, 20px) 16px 120px 16px;
      overflow-x: hidden;
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 12px 36px 0 rgba(0, 0, 0, 0.45),
                  inset 0 1px 1px var(--glass-specular);
    }

    header {
      width: 100%;
      max-width: 1100px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      border-radius: var(--radius-large);
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0A84FF, #5E5CE6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(10, 132, 255, 0.4);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action-pill {
      background: var(--ios-blue);
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .btn-action-pill:active { transform: scale(0.96); }

    .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass-pill);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Biometric Linking Banner */
    .bio-setup-banner {
      width: 100%;
      max-width: 1100px;
      padding: 12px 18px;
      border-radius: var(--radius-medium);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      background: rgba(48, 209, 88, 0.15);
      border: 1px solid rgba(48, 209, 88, 0.35);
    }

    .btn-bio-link {
      background: var(--ios-green);
      color: #000;
      border: none;
      font-weight: 700;
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
    }

    /* Folder Container */
    .folders-wrapper {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .folder-container {
      background: var(--glass-folder);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-large);
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      transition: all 0.25s ease;
    }

    .folder-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .folder-header.collapsed-header {
      margin-bottom: 0;
    }

    .folder-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .folder-icon {
      font-size: 20px;
    }

    .folder-title-input {
      background: transparent;
      border: 1px solid transparent;
      color: #fff;
      font-size: 19px;
      font-weight: 700;
      outline: none;
      border-radius: 6px;
      padding: 2px 6px;
      width: 100%;
      max-width: 320px;
    }
    .folder-title-input:hover { background: rgba(255, 255, 255, 0.08); }
    .folder-title-input:focus { background: rgba(0,0,0,0.4); border-color: var(--ios-blue); }

    .folder-count-badge {
      font-size: 12px;
      color: var(--text-sub);
      background: var(--glass-pill);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .folder-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-minimize {
      background: var(--glass-pill);
      border: 1px solid var(--glass-border);
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: transform 0.2s;
    }

    .btn-add-acc {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid var(--glass-border);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    /* Accounts Grid inside Folder */
    .accounts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 14px;
      transition: all 0.3s ease;
    }

    .accounts-grid.collapsed {
      display: none;
    }

    /* Account Card */
    .app-card {
      border-radius: var(--radius-medium);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .app-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .app-avatar-wrapper {
      position: relative;
      cursor: pointer;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    .app-avatar {
      width: 100%;
      height: 100%;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 700;
      background: var(--glass-pill);
      border: 1px solid var(--glass-border);
      overflow: hidden;
    }
    .app-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .avatar-badge-edit {
      position: absolute;
      bottom: -2px;
      right: -2px;
      background: var(--ios-blue);
      border-radius: 50%;
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      border: 1px solid #fff;
    }

    .inline-edit {
      background: transparent;
      border: 1px solid transparent;
      color: #fff;
      outline: none;
      border-radius: 6px;
      padding: 2px 4px;
      width: 100%;
    }
    .inline-edit:hover { background: rgba(255, 255, 255, 0.08); }
    .inline-edit:focus { background: rgba(0,0,0,0.45); border-color: var(--ios-blue); }

    .edit-app-name {
      font-size: 15px;
      font-weight: 700;
    }

    .field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 5px 8px;
      border-radius: var(--radius-small);
      gap: 6px;
    }

    .field-left {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
    }

    .field-label {
      font-size: 9px;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text-sub);
    }

    .copy-btn, .toggle-btn {
      background: var(--glass-pill);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .copy-btn.copied { background: var(--ios-green) !important; color: #000 !important; }

    .notes-row {
      background: rgba(0, 0, 0, 0.18);
      border: 1px dashed rgba(255, 255, 255, 0.14);
      border-radius: var(--radius-small);
      padding: 5px 8px;
      display: flex;
      flex-direction: column;
    }
    .edit-notes { font-size: 12px; color: #d1d5db; }

    /* Lock Screen Modal */
    #lockScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lock-card {
      width: 100%;
      max-width: 360px;
      border-radius: var(--radius-large);
      padding: 30px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .form-input {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--glass-border);
      padding: 12px 14px;
      border-radius: var(--radius-medium);
      color: #fff;
      font-size: 16px;
      outline: none;
      width: 100%;
      text-align: center;
    }

    .btn-primary {
      background: var(--ios-blue);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      padding: 12px;
      border-radius: var(--radius-medium);
      border: none;
      cursor: pointer;
      width: 100%;
    }

    .btn-biometric {
      background: var(--glass-pill);
      border: 1px solid var(--glass-border);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 12px;
      border-radius: var(--radius-medium);
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bar glass-panel">
      <div class="logo-group">
        <div class="logo-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
          </svg>
        </div>
        <div>
          <h1 style="font-size: 18px; font-weight: 700;">Keys Vault</h1>
          <p style="font-size: 11px; color: var(--text-sub);">Folders & Biometric Enclave</p>
        </div>
      </div>

      <div class="header-actions">
        <!-- Add New Folder Button -->
        <button class="btn-action-pill" onclick="addNewFolder()">
          <span>+ New Folder</span>
        </button>

        <!-- Lock Button -->
        <button class="btn-icon" title="Lock" onclick="lockVault()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- One-Time Biometric Setup Banner (Displays if phone not linked yet) -->
  <div id="bioLinkBanner" class="bio-setup-banner" style="display: none;">
    <div>
      <h4 style="font-size: 14px; font-weight: 700;" id="bannerBioTitle">Connect Biometrics</h4>
      <p style="font-size: 12px; color: var(--text-sub);" id="bannerBioDesc">Link your phone's biometric sensor for instant unlock.</p>
    </div>
    <button class="btn-bio-link" onclick="enrollBiometrics()" id="bannerBioBtn">Link Now</button>
  </div>

  <!-- Hidden Avatar Upload Input -->
  <input type="file" id="iconFileInput" accept="image/*" style="display: none;" onchange="handleIconUpload(event)" />

  <!-- Folders Container -->
  <main class="folders-wrapper" id="foldersContainer"></main>

  <!-- Lock Screen Modal -->
  <div id="lockScreen">
    <div class="lock-card glass-panel">
      <div class="logo-badge" style="width: 54px; height: 54px; border-radius: 16px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <div>
        <h2 id="lockTitle" style="font-size: 20px; font-weight: 700;">Vault Locked</h2>
        <p id="lockSubtitle" style="font-size: 13px; color: var(--text-sub); margin-top: 2px;">Unlock your credentials</p>
      </div>

      <!-- Quick Biometric Unlock (Triggers native Face ID / Fingerprint prompt) -->
      <button class="btn-biometric" id="bioUnlockBtn" onclick="authenticateBiometrics()" style="display: none;">
        <svg id="bioUnlockIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        <span id="bioUnlockText">Unlock</span>
      </button>

      <input type="password" id="masterPassInput" class="form-input" placeholder="Or enter Master Password" onkeydown="if(event.key==='Enter') unlockWithPassword()" />
      <button class="btn-primary" onclick="unlockWithPassword()">Unlock with Password</button>

      <p id="lockError" style="color: var(--ios-red); font-size: 12px; display: none;">Invalid Password</p>
    </div>
  </div>

  <script>
    /* ====================================================================
       1. DATA STRUCTURE WITH FOLDERS & ACCOUNTS
       ==================================================================== */
    let activeUploadInfo = null; // { folderId, accId }

    let vaultFolders = [
      {
        id: "f_google",
        title: "Google Accounts",
        collapsed: false,
        accounts: [
          { id: "g1", app: "Google (Personal)", email: "personal@gmail.com", password: "PasswordGoogle1!", notes: "Main Gmail & YouTube", icon: "" },
          { id: "g2", app: "Google (Work)", email: "work.account@company.com", password: "WorkPass#2026", notes: "Google Meet & Drive", icon: "" },
          { id: "g3", app: "Google (Gaming / Play)", email: "gamer.play@gmail.com", password: "PlayStorePass99", notes: "Purchased apps & games", icon: "" }
        ]
      },
      {
        id: "f_social",
        title: "Social & Discord",
        collapsed: false,
        accounts: [
          { id: "s1", app: "Discord", email: "gamer_tag#1001", password: "DiscordTokenSecret", notes: "Owns 2 servers", icon: "" }
        ]
      }
    ];

    /* ====================================================================
       2. DEVICE BIOMETRICS (Passkeys via Apple Secure Enclave & Android Keystore)
       ==================================================================== */
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const isAndroid = /Android/i.test(navigator.userAgent);

    function bufferToBase64(buffer) {
      return btoa(String.fromCharCode(...new Uint8Array(buffer)));
    }
    function base64ToBuffer(base64) {
      return Uint8Array.from(atob(base64), c => c.charCodeAt(0));
    }

    function initBiometricUI() {
      const bioBtn = document.getElementById("bioUnlockBtn");
      const bioText = document.getElementById("bioUnlockText");
      const bioIcon = document.getElementById("bioUnlockIcon");

      const bannerTitle = document.getElementById("bannerBioTitle");
      const bannerBtn = document.getElementById("bannerBioBtn");

      if (isIOS) {
        bioText.innerText = "Unlock with Face ID";
        bioIcon.innerHTML = `<path d="M7 3H5a2 2 0 0 0-2 2v2m18-4h-2a2 2 0 0 0-2 2v2M3 17v2a2 2 0 0 0 2 2h2m14-4v2a2 2 0 0 1-2 2h-2"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="9" r="1"/><path d="M10 15h4"/>`;
        bannerTitle.innerText = "Link Face ID";
        bannerBtn.innerText = "Link Face ID";
      } else if (isAndroid) {
        bioText.innerText = "Unlock with Fingerprint";
        bioIcon.innerHTML = `<path d="M12 2a10 10 0 0 0-10 10v1a10 10 0 0 0 10 10 10 10 0 0 0 10-10v-1A10 10 0 0 0 12 2z"/><path d="M12 7v5"/><path d="M8 12a4 4 0 0 1 8 0"/>`;
        bannerTitle.innerText = "Link Fingerprint";
        bannerBtn.innerText = "Link Fingerprint";
      } else {
        bioText.innerText = "Unlock with Biometrics / PIN";
        bioIcon.innerHTML = `<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>`;
      }

      // Check if already registered on this device
      const registeredCred = localStorage.getItem("keys_vault_biometric_id");
      if (registeredCred) {
        bioBtn.style.display = "flex";
        document.getElementById("bioLinkBanner").style.display = "none";
      } else {
        bioBtn.style.display = "none";
      }
    }

    // Step 1: Enroll (Creates the key inside iPhone's Face ID or Android's Fingerprint sensor)
    async function enrollBiometrics() {
      try {
        const challenge = new Uint8Array(32);
        window.crypto.getRandomValues(challenge);

        const credential = await navigator.credentials.create({
          publicKey: {
            challenge: challenge,
            rp: { name: "Keys Vault", id: window.location.hostname },
            user: {
              id: new Uint8Array([1, 2, 3, 4, 5, 6]),
              name: "vault_user",
              displayName: "Vault Owner"
            },
            pubKeyCredParams: [
              { type: "public-key", alg: -7 },  // ES256
              { type: "public-key", alg: -257 } // RS256
            ],
            authenticatorSelection: {
              authenticatorAttachment: "platform", // strictly Face ID / Fingerprint
              userVerification: "required"
            },
            timeout: 60000
          }
        });

        if (credential) {
          localStorage.setItem("keys_vault_biometric_id", bufferToBase64(credential.rawId));
          alert(isIOS ? "Face ID successfully linked!" : "Fingerprint successfully linked!");
          document.getElementById("bioLinkBanner").style.display = "none";
          document.getElementById("bioUnlockBtn").style.display = "flex";
        }
      } catch (err) {
        alert("Linking failed: " + err.message + "\nMake sure you are on HTTPS (GitHub/Neocities) and approve the phone prompt.");
      }
    }

    // Step 2: Authenticate (Prompts iPhone Face ID or Android Fingerprint)
    async function authenticateBiometrics() {
      const credId = localStorage.getItem("keys_vault_biometric_id");
      if (!credId) {
        alert("Please unlock with password first and tap 'Link' to connect Face ID / Fingerprint.");
        return;
      }

      try {
        const challenge = new Uint8Array(32);
        window.crypto.getRandomValues(challenge);

        const assertion = await navigator.credentials.get({
          publicKey: {
            challenge: challenge,
            allowCredentials: [{
              type: "public-key",
              id: base64ToBuffer(credId)
            }],
            userVerification: "required",
            timeout: 60000
          }
        });

        if (assertion) {
          loadStoredData();
        }
      } catch (err) {
        alert("Biometric verification canceled or not recognized.");
      }
    }

    /* ====================================================================
       3. STORAGE & UNLOCK
       ==================================================================== */
    function persist() {
      localStorage.setItem("keys_vault_folders", JSON.stringify(vaultFolders));
    }

    function loadStoredData() {
      const stored = localStorage.getItem("keys_vault_folders");
      if (stored) {
        vaultFolders = JSON.parse(stored);
      }
      document.getElementById("lockScreen").style.display = "none";

      // If not yet linked to phone's biometric, show enrollment banner
      if (!localStorage.getItem("keys_vault_biometric_id")) {
        document.getElementById("bioLinkBanner").style.display = "flex";
      }

      renderFolders();
    }

    function unlockWithPassword() {
      const pass = document.getElementById("masterPassInput").value;
      if (!pass) return;
      loadStoredData();
    }

    function lockVault() {
      document.getElementById("masterPassInput").value = "";
      document.getElementById("lockScreen").style.display = "flex";
    }

    /* ====================================================================
       4. FOLDER MANAGEMENT (MINIMIZE, RENAME, ADD, DELETE)
       ==================================================================== */
    function toggleFolderCollapse(folderId) {
      const folder = vaultFolders.find(f => f.id === folderId);
      if (folder) {
        folder.collapsed = !folder.collapsed;
        persist();
        renderFolders();
      }
    }

    function updateFolderTitle(folderId, newTitle) {
      const folder = vaultFolders.find(f => f.id === folderId);
      if (folder) {
        folder.title = newTitle;
        persist();
      }
    }

    function addNewFolder() {
      const newF = {
        id: "f_" + Date.now(),
        title: "New Folder",
        collapsed: false,
        accounts: []
      };
      vaultFolders.unshift(newF);
      persist();
      renderFolders();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function deleteFolder(folderId) {
      vaultFolders = vaultFolders.filter(f => f.id !== folderId);
      persist();
      renderFolders();
    }

    function addAccountToFolder(folderId) {
      const folder = vaultFolders.find(f => f.id === folderId);
      if (folder) {
        folder.collapsed = false; // open folder if minimized
        folder.accounts.push({
          id: "acc_" + Date.now(),
          app: "New Account",
          email: "user@domain.com",
          password: "Password123",
          notes: "Account description...",
          icon: ""
        });
        persist();
        renderFolders();
      }
    }

    /* ====================================================================
       5. ACCOUNT CARD OPERATIONS
       ==================================================================== */
    function updateAccountField(folderId, accId, field, val) {
      const folder = vaultFolders.find(f => f.id === folderId);
      if (folder) {
        const acc = folder.accounts.find(a => a.id === accId);
        if (acc) {
          acc[field] = val;
          persist();
        }
      }
    }

    function deleteAccount(folderId, accId) {
      const folder = vaultFolders.find(f => f.id === folderId);
      if (folder) {
        folder.accounts = folder.accounts.filter(a => a.id !== accId);
        persist();
        renderFolders();
      }
    }

    function promptIconUpload(folderId, accId) {
      activeUploadInfo = { folderId, accId };
      document.getElementById("iconFileInput").click();
    }

    function handleIconUpload(e) {
      const file = e.target.files[0];
      if (!file || !activeUploadInfo) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        updateAccountField(activeUploadInfo.folderId, activeUploadInfo.accId, 'icon', evt.target.result);
        renderFolders();
      };
      reader.readAsDataURL(file);
      e.target.value = "";
    }

    /* ====================================================================
       6. RENDER FOLDERS AND ACCOUNTS
       ==================================================================== */
    function renderFolders() {
      const container = document.getElementById("foldersContainer");
      container.innerHTML = "";

      vaultFolders.forEach(folder => {
        const folderEl = document.createElement("div");
        folderEl.className = "folder-container glass-panel";

        const countText = `${folder.accounts.length} ${folder.accounts.length === 1 ? 'account' : 'accounts'}`;

        folderEl.innerHTML = `
          <!-- Folder Bar -->
          <div class="folder-header ${folder.collapsed ? 'collapsed-header' : ''}">
            <div class="folder-left">
              <span class="folder-icon">📁</span>
              <input class="folder-title-input" value="${escapeHtml(folder.title)}" 
                oninput="updateFolderTitle('${folder.id}', this.value)" placeholder="Folder Name..." />
              <span class="folder-count-badge">${countText}</span>
            </div>

            <div class="folder-actions">
              <!-- Add Account inside this folder -->
              <button class="btn-add-acc" onclick="addAccountToFolder('${folder.id}')">+ Account</button>
              
              <!-- Minimize / Expand Toggle -->
              <button class="btn-minimize" title="${folder.collapsed ? 'Expand' : 'Minimize'}" 
                onclick="toggleFolderCollapse('${folder.id}')">
                ${folder.collapsed ? '▲' : '▼'}
              </button>

              <!-- Delete Folder -->
              <button class="btn-minimize" style="color: var(--ios-red);" title="Delete Folder" 
                onclick="deleteFolder('${folder.id}')">✕</button>
            </div>
          </div>

          <!-- Accounts Grid (Minimizable) -->
          <div class="accounts-grid ${folder.collapsed ? 'collapsed' : ''}" id="grid-${folder.id}">
            <!-- Account Cards dynamically injected -->
          </div>
        `;

        const gridEl = folderEl.querySelector(`#grid-${folder.id}`);

        folder.accounts.forEach(acc => {
          const card = document.createElement("div");
          card.className = "app-card glass-panel";

          const avatarContent = acc.icon 
            ? `<img src="${acc.icon}" alt="app" />`
            : (acc.app ? acc.app[0].toUpperCase() : "?");

          card.innerHTML = `
            <div class="card-top">
              <div class="app-brand">
                <div class="app-avatar-wrapper" onclick="promptIconUpload('${folder.id}', '${acc.id}')" title="Upload Icon">
                  <div class="app-avatar">${avatarContent}</div>
                  <div class="avatar-badge-edit">✎</div>
                </div>

                <input class="inline-edit edit-app-name" value="${escapeHtml(acc.app)}" 
                  oninput="updateAccountField('${folder.id}', '${acc.id}', 'app', this.value)" placeholder="Account Title" />
              </div>

              <!-- Delete Account Button (Instant) -->
              <button class="btn-minimize" style="color: var(--ios-red); width:28px; height:28px;" title="Delete" 
                onclick="deleteAccount('${folder.id}', '${acc.id}')">✕</button>
            </div>

            <!-- Email / User Row -->
            <div class="field-row">
              <div class="field-left">
                <span class="field-label">Username / Email</span>
                <input class="inline-edit" value="${escapeHtml(acc.email)}" 
                  oninput="updateAccountField('${folder.id}', '${acc.id}', 'email', this.value)" />
              </div>
              <button class="copy-btn" onclick="copyValue('${escapeAttr(acc.email)}', this)">Copy</button>
            </div>

            <!-- Password Row -->
            <div class="field-row">
              <div class="field-left">
                <span class="field-label">Password</span>
                <input type="password" id="pass-${acc.id}" class="inline-edit" value="${escapeHtml(acc.password)}" 
                  oninput="updateAccountField('${folder.id}', '${acc.id}', 'password', this.value)" />
              </div>
              <div style="display:flex; gap:4px;">
                <button class="toggle-btn" onclick="togglePass('${acc.id}')">👁</button>
                <button class="copy-btn" onclick="copyValue('${escapeAttr(acc.password)}', this)">Copy</button>
              </div>
            </div>

            <!-- Description / Notes -->
            <div class="notes-row">
              <span class="field-label">Notes</span>
              <input class="inline-edit edit-notes" value="${escapeHtml(acc.notes || '')}" 
                placeholder="Add notes..." 
                oninput="updateAccountField('${folder.id}', '${acc.id}', 'notes', this.value)" />
            </div>
          `;

          gridEl.appendChild(card);
        });

        container.appendChild(folderEl);
      });
    }

    function togglePass(id) {
      const el = document.getElementById(`pass-${id}`);
      el.type = el.type === "password" ? "text" : "password";
    }

    async function copyValue(val, btn) {
      try {
        await navigator.clipboard.writeText(val);
        const original = btn.innerText;
        btn.innerText = "Copied!";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.innerText = original;
          btn.classList.remove("copied");
        }, 1200);
      } catch (e) {
        console.error(e);
      }
    }

    function escapeHtml(s) {
      return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function escapeAttr(s) {
      return (s || "").replace(/'/g, "\\'").replace(/"/g, "&quot;");
    }

    window.addEventListener("DOMContentLoaded", () => {
      initBiometricUI();
    });
  </script>
</body>
</html>
