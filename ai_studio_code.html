<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#090a10" />
  <title>Keys Vault</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 10% 15%, rgba(10, 132, 255, 0.28), transparent 45%),
                     radial-gradient(circle at 90% 85%, rgba(236, 72, 153, 0.22), transparent 45%),
                     radial-gradient(circle at 50% 50%, rgba(94, 92, 230, 0.18), transparent 50%),
                     #090a10;
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-pill: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-specular: rgba(255, 255, 255, 0.35);
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.55);
      --ios-blue: #0A84FF;
      --ios-green: #30D158;
      --ios-red: #FF453A;
      --radius-large: 26px;
      --radius-medium: 16px;
      --radius-small: 10px;
      --card-min-width: 320px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: env(safe-area-inset-top, 20px) 16px 120px 16px;
      overflow-x: hidden;
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 12px 36px 0 rgba(0, 0, 0, 0.45),
                  inset 0 1px 1px var(--glass-specular);
    }

    header {
      width: 100%;
      max-width: 1200px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      border-radius: var(--radius-large);
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0A84FF, #5E5CE6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(10, 132, 255, 0.4);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass-pill);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .btn-icon:active { transform: scale(0.9); }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 220px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border-radius: var(--radius-medium);
    }

    .search-box input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 15px;
      width: 100%;
      outline: none;
    }
    .search-box input::placeholder { color: var(--text-sub); }

    .segmented-control {
      display: inline-flex;
      padding: 3px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--glass-border);
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: var(--text-sub);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 10px;
      cursor: pointer;
    }

    .seg-btn.active {
      background: var(--glass-pill);
      color: #fff;
    }

    /* Free Drag Grid with Auto Alignment */
    .vault-grid {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--card-min-width), 1fr));
      gap: 16px;
      transition: all 0.25s ease;
    }
    .vault-grid.compact { --card-min-width: 260px; gap: 10px; }
    .vault-grid.expanded { --card-min-width: 440px; gap: 20px; }

    /* Cards */
    .app-card {
      border-radius: var(--radius-large);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      user-select: none;
      touch-action: pan-y;
      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.2s, opacity 0.2s;
    }

    /* Dragging States */
    .app-card.is-dragging {
      opacity: 0.45;
      transform: scale(0.96);
    }
    .app-card.drag-over {
      border: 2px dashed var(--ios-blue) !important;
      transform: scale(1.02);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .app-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    /* Uploadable Avatar Icon */
    .app-avatar-wrapper {
      position: relative;
      cursor: pointer;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }

    .app-avatar {
      width: 100%;
      height: 100%;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      font-weight: 700;
      background: var(--glass-pill);
      border: 1px solid var(--glass-border);
      overflow: hidden;
    }

    .app-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-badge-edit {
      position: absolute;
      bottom: -2px;
      right: -2px;
      background: var(--ios-blue);
      border-radius: 50%;
      width: 15px;
      height: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      border: 1px solid #fff;
    }

    .app-titles {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
    }

    /* Direct In-Preview Editing */
    .inline-edit {
      background: transparent;
      border: 1px solid transparent;
      color: #fff;
      outline: none;
      border-radius: 6px;
      padding: 2px 4px;
      width: 100%;
      user-select: text;
    }

    .inline-edit:hover { background: rgba(255, 255, 255, 0.08); }
    .inline-edit:focus {
      background: rgba(0, 0, 0, 0.45);
      border-color: var(--ios-blue);
    }

    .edit-app-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .edit-category {
      font-size: 11px;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .card-tools {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .drag-handle {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
      background: var(--glass-pill);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      font-size: 14px;
    }
    .drag-handle:active { cursor: grabbing; }

    .btn-tool {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
      background: var(--glass-pill);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-tool.del:hover { background: rgba(255, 69, 58, 0.35); border-color: var(--ios-red); }

    /* Field Rows */
    .field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 10px;
      border-radius: var(--radius-small);
      gap: 8px;
    }

    .field-left {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
    }

    .field-label {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text-sub);
    }

    .copy-btn, .toggle-btn {
      background: var(--glass-pill);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .copy-btn.copied {
      background: var(--ios-green) !important;
      color: #000 !important;
    }

    /* Direct Description / Notes Area */
    .notes-row {
      background: rgba(0, 0, 0, 0.18);
      border: 1px dashed rgba(255, 255, 255, 0.14);
      border-radius: var(--radius-small);
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
    }

    .edit-notes {
      font-size: 12px;
      color: #d1d5db;
    }

    /* Lock Screen Modal */
    #lockScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lock-card {
      width: 100%;
      max-width: 360px;
      border-radius: var(--radius-large);
      padding: 30px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .form-input {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--glass-border);
      padding: 12px 14px;
      border-radius: var(--radius-medium);
      color: #fff;
      font-size: 16px;
      outline: none;
      width: 100%;
      text-align: center;
    }
    .form-input:focus { border-color: var(--ios-blue); }

    .btn-primary {
      background: var(--ios-blue);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      padding: 12px;
      border-radius: var(--radius-medium);
      border: none;
      cursor: pointer;
      width: 100%;
    }

    .btn-biometric {
      background: var(--glass-pill);
      border: 1px solid var(--glass-border);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      padding: 11px;
      border-radius: var(--radius-medium);
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    @media (max-width: 600px) {
      .controls-row { flex-direction: column; align-items: stretch; }
      .segmented-control { align-self: center; }
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bar glass-panel">
      <div class="logo-group">
        <div class="logo-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
          </svg>
        </div>
        <div>
          <h1 style="font-size: 18px; font-weight: 700;">Keys Vault</h1>
          <p style="font-size: 11px; color: var(--text-sub);">Drag to auto-align • Direct editing</p>
        </div>
      </div>

      <div class="header-actions">
        <!-- New Box -->
        <button class="btn-icon" title="Add Account Box" onclick="addNewCard()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>

        <!-- Lock Vault -->
        <button class="btn-icon" title="Lock" onclick="lockVault()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </button>
      </div>
    </div>

    <!-- Filter & Size Sizer -->
    <div class="controls-row">
      <div class="search-box glass-panel">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-sub)" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" placeholder="Search accounts, notes, titles..." oninput="renderCards()" />
      </div>

      <div class="segmented-control">
        <button class="seg-btn" onclick="setSize('compact')" id="btnCompact">Compact</button>
        <button class="seg-btn active" onclick="setSize('normal')" id="btnNormal">Standard</button>
        <button class="seg-btn" onclick="setSize('expanded')" id="btnExpanded">Expanded</button>
      </div>
    </div>
  </header>

  <!-- Hidden File Input for Icon Uploads -->
  <input type="file" id="iconFileInput" accept="image/*" style="display: none;" onchange="handleIconUpload(event)" />

  <!-- The Auto-aligning Grid -->
  <main class="vault-grid" id="cardsContainer"></main>

  <!-- Lock & Device Specific Biometric Screen -->
  <div id="lockScreen">
    <div class="lock-card glass-panel">
      <div class="logo-badge" style="width: 54px; height: 54px; border-radius: 16px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <div>
        <h2 id="lockTitle" style="font-size: 20px; font-weight: 700;">Locked</h2>
        <p id="lockSubtitle" style="font-size: 13px; color: var(--text-sub); margin-top: 2px;">Protected locally</p>
      </div>

      <!-- Device Biometric Button (Auto clicked on open if available) -->
      <button class="btn-biometric" id="bioBtn" onclick="triggerBiometricAuth()">
        <!-- Dynamic Fingerprint / Face ID SVG -->
        <svg id="bioIcon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        <span id="bioLabel">Unlock with Biometrics</span>
      </button>

      <input type="password" id="masterPassInput" class="form-input" placeholder="Or enter Master Password" onkeydown="if(event.key==='Enter') unlockWithPassword()" />
      <button class="btn-primary" onclick="unlockWithPassword()" id="unlockBtn">Unlock</button>

      <p id="lockError" style="color: var(--ios-red); font-size: 12px; display: none;">Invalid Master Password</p>
    </div>
  </div>

  <script>
    /* ====================================================================
       1. DATA & STATE MANAGEMENT
       ==================================================================== */
    let masterKey = "";
    let activeUploadId = null;
    let draggedIndex = null;

    let vaultItems = [
      { id: "1", app: "Google", category: "Email", email: "personal@gmail.com", password: "Password#2026", notes: "Primary email with 2FA enabled", icon: "" },
      { id: "2", app: "Discord", category: "Social", email: "game_master", password: "DiscordToken!88", notes: "Nitro subscription active", icon: "" }
    ];

    /* ====================================================================
       2. DEVICE DETECTION: iPHONE (FACE ID) vs ANDROID (FINGERPRINT)
       ==================================================================== */
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const isAndroid = /Android/i.test(navigator.userAgent);

    function configureBiometricUI() {
      const label = document.getElementById("bioLabel");
      const icon = document.getElementById("bioIcon");

      if (isIOS) {
        label.innerText = "Unlock with Face ID";
        // Face ID Icon
        icon.innerHTML = `<path d="M7 3H5a2 2 0 0 0-2 2v2m18-4h-2a2 2 0 0 0-2 2v2M3 17v2a2 2 0 0 0 2 2h2m14-4v2a2 2 0 0 1-2 2h-2"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="9" r="1"/><path d="M10 15h4"/>`;
      } else if (isAndroid) {
        label.innerText = "Unlock with Fingerprint";
        // Fingerprint Icon
        icon.innerHTML = `<path d="M12 2a10 10 0 0 0-10 10v1a10 10 0 0 0 10 10 10 10 0 0 0 10-10v-1A10 10 0 0 0 12 2z"/><path d="M12 7v5"/><path d="M8 12a4 4 0 0 1 8 0"/>`;
      } else {
        label.innerText = "Unlock with Biometrics / PIN";
        icon.innerHTML = `<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>`;
      }
    }

    // Automatically prompt Face ID (iPhone) or Fingerprint (Android) as soon as the app opens
    async function autoPromptBiometrics() {
      if (window.PublicKeyCredential) {
        try {
          const available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
          if (available) {
            document.getElementById("bioBtn").style.display = "flex";
            // Wait a brief tick for view render, then trigger immediately
            setTimeout(() => { triggerBiometricAuth(); }, 350);
          }
        } catch (e) {
          console.log("Biometric auto-prompt waiting:", e);
        }
      }
    }

    async function triggerBiometricAuth() {
      try {
        const challenge = new Uint8Array(32);
        window.crypto.getRandomValues(challenge);
        
        // This triggers the native Face ID (iOS) or Fingerprint (Android) system prompt
        const assertion = await navigator.credentials.get({
          publicKey: {
            challenge: challenge,
            timeout: 60000,
            userVerification: "required"
          }
        });

        if (assertion) {
          loadDecryptedData();
        }
      } catch (err) {
        // Fallback gracefully to Master Password if canceled or first-time
        console.log("Biometric bypassed or not enrolled yet.");
      }
    }

    /* ====================================================================
       3. STORAGE & PASSWORDS
       ==================================================================== */
    function persist() {
      localStorage.setItem("keys_vault_data", JSON.stringify(vaultItems));
    }

    function loadDecryptedData() {
      const stored = localStorage.getItem("keys_vault_data");
      if (stored) {
        vaultItems = JSON.parse(stored);
      }
      document.getElementById("lockScreen").style.display = "none";
      renderCards();
    }

    function unlockWithPassword() {
      const pass = document.getElementById("masterPassInput").value;
      if (!pass) return;
      masterKey = pass;
      loadDecryptedData();
    }

    function lockVault() {
      document.getElementById("masterPassInput").value = "";
      document.getElementById("lockScreen").style.display = "flex";
    }

    /* ====================================================================
       4. DIRECT IN-PREVIEW EDITING & IMMEDIATE DELETION
       ==================================================================== */
    function updateField(id, field, value) {
      const item = vaultItems.find(i => i.id === id);
      if (item) {
        item[field] = value;
        persist(); // auto-save on every single key press
      }
    }

    function deleteImmediately(id) {
      vaultItems = vaultItems.filter(i => i.id !== id);
      persist();
      renderCards();
    }

    function addNewCard() {
      const newItem = {
        id: Date.now().toString(),
        app: "New Account",
        category: "General",
        email: "user@domain.com",
        password: "Password123",
        notes: "Describe this account here...",
        icon: ""
      };
      vaultItems.unshift(newItem);
      persist();
      renderCards();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ====================================================================
       5. UPLOADABLE ICON HANDLING
       ==================================================================== */
    function promptIconUpload(id) {
      activeUploadId = id;
      document.getElementById("iconFileInput").click();
    }

    function handleIconUpload(e) {
      const file = e.target.files[0];
      if (!file || !activeUploadId) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const base64Img = evt.target.result;
        updateField(activeUploadId, 'icon', base64Img);
        renderCards();
      };
      reader.readAsDataURL(file);
      e.target.value = ""; // reset
    }

    /* ====================================================================
       6. TOUCH & DESKTOP FREE DRAG-AND-DROP AUTO-ALIGNMENT
       ==================================================================== */
    function attachDragEvents(cardEl, index) {
      // Desktop HTML5 drag
      cardEl.addEventListener("dragstart", (e) => {
        draggedIndex = index;
        cardEl.classList.add("is-dragging");
        e.dataTransfer.effectAllowed = "move";
      });

      cardEl.addEventListener("dragend", () => {
        cardEl.classList.remove("is-dragging");
        document.querySelectorAll(".app-card").forEach(c => c.classList.remove("drag-over"));
      });

      cardEl.addEventListener("dragover", (e) => {
        e.preventDefault();
        cardEl.classList.add("drag-over");
      });

      cardEl.addEventListener("dragleave", () => {
        cardEl.classList.remove("drag-over");
      });

      cardEl.addEventListener("drop", (e) => {
        e.preventDefault();
        cardEl.classList.remove("drag-over");
        if (draggedIndex === null || draggedIndex === index) return;

        // Auto re-align in grid
        const itemToMove = vaultItems.splice(draggedIndex, 1)[0];
        vaultItems.splice(index, 0, itemToMove);
        persist();
        renderCards();
      });

      // Mobile Touch Drag Handle
      const handle = cardEl.querySelector(".drag-handle");
      if (handle) {
        handle.addEventListener("touchstart", (e) => {
          draggedIndex = index;
          cardEl.classList.add("is-dragging");
        }, { passive: true });

        handle.addEventListener("touchmove", (e) => {
          const touch = e.touches[0];
          const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
          const dropCard = targetEl ? targetEl.closest(".app-card") : null;
          
          document.querySelectorAll(".app-card").forEach(c => c.classList.remove("drag-over"));
          if (dropCard && dropCard !== cardEl) {
            dropCard.classList.add("drag-over");
          }
        }, { passive: true });

        handle.addEventListener("touchend", (e) => {
          cardEl.classList.remove("is-dragging");
          const touch = e.changedTouches[0];
          const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
          const dropCard = targetEl ? targetEl.closest(".app-card") : null;

          if (dropCard) {
            const targetIndex = parseInt(dropCard.getAttribute("data-index"), 10);
            if (!isNaN(targetIndex) && targetIndex !== draggedIndex) {
              const itemToMove = vaultItems.splice(draggedIndex, 1)[0];
              vaultItems.splice(targetIndex, 0, itemToMove);
              persist();
              renderCards();
              return;
            }
          }
          document.querySelectorAll(".app-card").forEach(c => c.classList.remove("drag-over"));
        });
      }
    }

    /* ====================================================================
       7. RENDER THE INTERFACE
       ==================================================================== */
    function renderCards() {
      const container = document.getElementById("cardsContainer");
      const search = document.getElementById("searchInput").value.toLowerCase();
      container.innerHTML = "";

      vaultItems.forEach((item, index) => {
        if (
          search &&
          !item.app.toLowerCase().includes(search) &&
          !item.email.toLowerCase().includes(search) &&
          !item.category.toLowerCase().includes(search) &&
          !(item.notes && item.notes.toLowerCase().includes(search))
        ) {
          return;
        }

        const card = document.createElement("div");
        card.className = "app-card glass-panel";
        card.draggable = true;
        card.setAttribute("data-index", index);

        // Icon or Initial
        const avatarContent = item.icon 
          ? `<img src="${item.icon}" alt="app" />`
          : (item.app ? item.app[0].toUpperCase() : "?");

        card.innerHTML = `
          <div class="card-top">
            <div class="app-brand">
              <!-- Uploadable Icon -->
              <div class="app-avatar-wrapper" onclick="promptIconUpload('${item.id}')" title="Tap to upload image icon">
                <div class="app-avatar">${avatarContent}</div>
                <div class="avatar-badge-edit">✎</div>
              </div>

              <!-- Directly Editable Title & Category -->
              <div class="app-titles">
                <input class="inline-edit edit-app-name" value="${escapeHtml(item.app)}" 
                  oninput="updateField('${item.id}', 'app', this.value)" placeholder="App Title" />
                <input class="inline-edit edit-category" value="${escapeHtml(item.category)}" 
                  oninput="updateField('${item.id}', 'category', this.value)" placeholder="CATEGORY" />
              </div>
            </div>

            <div class="card-tools">
              <!-- Move / Drag Handle for Auto Alignment -->
              <div class="drag-handle" title="Hold & drag to reorder">⠿</div>
              <button class="btn-tool del" title="Delete" onclick="deleteImmediately('${item.id}')">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--ios-red)" stroke-width="2.5"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
              </button>
            </div>
          </div>

          <!-- Email / Username with Independent Copy -->
          <div class="field-row">
            <div class="field-left">
              <span class="field-label">Username / Email</span>
              <input class="inline-edit" value="${escapeHtml(item.email)}" 
                oninput="updateField('${item.id}', 'email', this.value)" />
            </div>
            <button class="copy-btn" onclick="copyValue('${escapeAttr(item.email)}', this)">Copy</button>
          </div>

          <!-- Password with Show/Hide & Copy -->
          <div class="field-row">
            <div class="field-left">
              <span class="field-label">Password</span>
              <input type="password" id="pass-${item.id}" class="inline-edit" value="${escapeHtml(item.password)}" 
                oninput="updateField('${item.id}', 'password', this.value)" />
            </div>
            <div style="display: flex; gap: 4px;">
              <button class="toggle-btn" onclick="togglePass('${item.id}')">👁</button>
              <button class="copy-btn" onclick="copyValue('${escapeAttr(item.password)}', this)">Copy</button>
            </div>
          </div>

          <!-- Directly Editable Description / Notes -->
          <div class="notes-row">
            <span class="field-label">Description / Notes</span>
            <input class="inline-edit edit-notes" value="${escapeHtml(item.notes || '')}" 
              placeholder="Tap to add description or notes..." 
              oninput="updateField('${item.id}', 'notes', this.value)" />
          </div>
        `;

        attachDragEvents(card, index);
        container.appendChild(card);
      });
    }

    function togglePass(id) {
      const el = document.getElementById(`pass-${id}`);
      el.type = el.type === "password" ? "text" : "password";
    }

    async function copyValue(val, btn) {
      try {
        await navigator.clipboard.writeText(val);
        const original = btn.innerText;
        btn.innerText = "Copied!";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.innerText = original;
          btn.classList.remove("copied");
        }, 1200);
      } catch (e) {
        console.error(e);
      }
    }

    function setSize(size) {
      const grid = document.getElementById("cardsContainer");
      grid.classList.remove("compact", "expanded");
      document.getElementById("btnCompact").classList.remove("active");
      document.getElementById("btnNormal").classList.remove("active");
      document.getElementById("btnExpanded").classList.remove("active");

      if (size === "compact") {
        grid.classList.add("compact");
        document.getElementById("btnCompact").classList.add("active");
      } else if (size === "expanded") {
        grid.classList.add("expanded");
        document.getElementById("btnExpanded").classList.add("active");
      } else {
        document.getElementById("btnNormal").classList.add("active");
      }
    }

    function escapeHtml(s) {
      return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function escapeAttr(s) {
      return (s || "").replace(/'/g, "\\'").replace(/"/g, "&quot;");
    }

    // Startup Execution
    window.addEventListener("DOMContentLoaded", () => {
      configureBiometricUI();
      autoPromptBiometrics();
    });
  </script>
</body>
</html>
